name: PulseCoach
options:
  bundleIdPrefix: com.pulsecoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  PulseCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PulseCoach
        excludes:
          - "Info.plist"
          - "Resources/Sounds"
      - path: PulseCoach/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsecoach.app
        INFOPLIST_FILE: PulseCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PulseCoachWidget
        embed: true

  PulseCoachWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PulseCoachWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsecoach.app.PulseCoachWidget
        INFOPLIST_FILE: PulseCoachWidget/Info.plist
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
